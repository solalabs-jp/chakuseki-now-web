runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  buildCommand: npm run build
  runCommand: npm run start

env:
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  # Firestore REST 認証はランタイム SA の ADC のみを使う(`firebase login`
  # トークンには依存しない)。roles/datastore.user が SA に必要。
  - variable: FIRESTORE_AUTH
    value: adc
    availability:
      - RUNTIME
